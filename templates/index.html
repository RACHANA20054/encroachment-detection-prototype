<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encroachment Detection Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --card: #12161f;
    --card-2: #161b26;
    --line: #232a38;
    --blue: #4d8dff;
    --blue-bg: rgba(77,141,255,0.12);
    --text: #eef1f6;
    --text-dim: #8b95a7;
    --text-faint: #545e70;
    --green: #34d399;
    --green-bg: rgba(52,211,153,0.12);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    padding: 22px 32px; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px; border-bottom: 1px solid var(--line);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 40px; height: 40px; border-radius: 10px; background: var(--blue-bg);
    border: 1px solid rgba(77,141,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: var(--blue); flex-shrink: 0;
  }
  .header-title { color: var(--text); font-weight: 700; font-size: 19px; letter-spacing: -0.2px; }
  .header-sub { color: var(--text-faint); font-size: 12.5px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .clock { color: var(--text-dim); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .status-badge {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 100px;
    font-weight: 700; font-size: 13px; letter-spacing: 0.2px;
  }
  .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .st-LOW { background: var(--green-bg); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
  .st-LOW .dot { background: var(--green); }
  .st-SUSPICIOUS, .st-MODERATE { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(251,191,36,0.25); }
  .st-SUSPICIOUS .dot, .st-MODERATE .dot { background: var(--amber); }
  .st-ALERT { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.3); animation: glow 1.2s infinite; }
  .st-ALERT .dot { background: var(--red); }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 32px 48px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 1050px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .card-title { font-weight: 700; font-size: 13.5px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

  .video-frame { background: #05070b; aspect-ratio: 4/3; }
  .video-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .metrics-list { padding: 4px 0; }
  .metric-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .metric-row:last-child { border-bottom: none; }
  .metric-label { color: var(--text-dim); font-size: 13px; font-weight: 500; }
  .metric-value { font-weight: 700; font-size: 14.5px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .metric-value.chip { padding: 3px 10px; border-radius: 6px; font-size: 12px; }
  .chip.LOW { background: var(--green-bg); color: var(--green); }
  .chip.SUSPICIOUS, .chip.MODERATE { background: var(--amber-bg); color: var(--amber); }
  .chip.ALERT { background: var(--red-bg); color: var(--red); }

  .events-section { margin-top: 24px; }
  .section-title { font-weight: 700; font-size: 15px; margin-bottom: 12px; color: var(--text); }
  table.events {
    width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
  }
  table.events th {
    text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    color: var(--text-faint); background: var(--card-2); padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  table.events td { padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--line); color: var(--text); }
  table.events tbody tr:last-child td { border-bottom: none; }
  table.events tbody tr:hover { background: var(--card-2); }
  td.time, td.num { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-dim); }
  td.obj { font-weight: 600; }
  .sev-chip { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 700; }
  .sev-chip.low { background: var(--green-bg); color: var(--green); }
  .sev-chip.moderate { background: var(--amber-bg); color: var(--amber); }
  .sev-chip.high { background: var(--red-bg); color: var(--red); }

  .events-scroll { max-height: 380px; overflow-y: auto; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="mark">ED</div>
    <div>
      <div class="header-title">Land Encroachment Detection System</div>
      <div class="header-sub">Prototype &middot; real camera feed &middot; simulated ESP32 sensor data</div>
    </div>
  </div>
  <div class="header-right">
    <span class="clock" id="clock">--:--:--</span>
    <span class="status-badge st-LOW" id="statusPill">
      <span class="dot"></span>
      <span id="statusPillText">LOW</span>
    </span>
  </div>
</div>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <div class="card-head"><span class="card-title"><span class="live-dot"></span>Live Camera Feed</span></div>
      <div class="video-frame"><img src="/video_feed"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title"><span class="live-dot"></span>AI Detection Output</span></div>
      <div class="video-frame"><img src="/video_feed_detected"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Detection Summary</span></div>
      <div class="metrics-list" id="results">
        <div class="metric-row"><span class="metric-label">Loading&hellip;</span><span class="metric-value"></span></div>
      </div>
    </div>
  </div>

  <div class="events-section">
    <div class="section-title">Recent Events</div>
    <div class="events-scroll">
      <table class="events">
        <thead>
          <tr><th>Time</th><th>Object</th><th>Fusion</th><th>Encroach %</th><th>ESI</th><th>Severity</th></tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function sevKey(status) {
  const s = (status || '').toUpperCase();
  if (s === 'ALERT' || s === 'HIGH') return 'high';
  if (s === 'SUSPICIOUS' || s === 'MODERATE') return 'moderate';
  return 'low';
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
}
setInterval(updateClock, 1000);
updateClock();

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  const status = (data.fusion.status || 'LOW').toUpperCase();

  const pill = document.getElementById('statusPill');
  pill.className = 'status-badge st-' + status;
  document.getElementById('statusPillText').textContent = status;

  document.getElementById('results').innerHTML = `
    <div class="metric-row"><span class="metric-label">Fusion score</span><span class="metric-value">${data.fusion.fusion_score ?? 0}%</span></div>
    <div class="metric-row"><span class="metric-label">Status</span><span class="metric-value chip ${status}">${status}</span></div>
    <div class="metric-row"><span class="metric-label">Encroachment</span><span class="metric-value">${data.affected_percent ?? 0}%</span></div>
    <div class="metric-row"><span class="metric-label">Severity (ESI)</span><span class="metric-value">${data.esi.esi ?? 0} &middot; ${data.esi.level ?? '-'}</span></div>
    <div class="metric-row"><span class="metric-label">PIR motion</span><span class="metric-value">${data.sensor_data.pir ? 'YES' : 'no'}</span></div>
    <div class="metric-row"><span class="metric-label">Distance</span><span class="metric-value">${data.sensor_data.distance_cm ?? '-'} cm</span></div>
    <div class="metric-row"><span class="metric-label">Vibration</span><span class="metric-value">${data.sensor_data.vibration ?? '-'}</span></div>
    <div class="metric-row"><span class="metric-label">Zone</span><span class="metric-value">${data.zone}</span></div>
  `;
}

async function refreshEvents() {
  const res = await fetch('/api/events');
  const events = await res.json();
  const body = document.getElementById('eventsBody');
  body.innerHTML = events.map(e => {
    const key = sevKey(e.severity_level);
    return `
      <tr>
        <td class="time">${e.timestamp}</td>
        <td class="obj">${e.object_type}</td>
        <td class="num">${e.fusion_score}</td>
        <td class="num">${e.affected_percent}%</td>
        <td class="num">${e.esi}</td>
        <td><span class="sev-chip ${key}">${e.severity_level}</span></td>
      </tr>
    `;
  }).join('');
}

setInterval(refreshStatus, 1000);
setInterval(refreshEvents, 3000);
refreshStatus();
refreshEvents();
</script>
</body>
</html>
